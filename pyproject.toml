[project]
authors = [
  {name = "Nuhil Lucas", email = "nuhillucasmail@163.com"},
]
dependencies = []
description = "Lucas' Functional Distribution, Which Integrates Some Commonly Used."
license = {file = "LICENSE"}
name = "pylucas"
readme = "README.md"
requires-python = ">=3.12"
version = "4.0.0"

[tool.poetry]
packages = [{include = "pylucas", from = "src"}]

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=2.0.0,<3.0.0"]

# poetry add <package> --optional <group>

[dependency-groups]
dev = [
    "tomli-w (>=1.2.0,<2.0.0)",
    "art (>=6.5,<7.0)",
    "pandas (>=3.0.0,<4.0.0)",
    "pathspec (>=1.0.3,<2.0.0)"
]
